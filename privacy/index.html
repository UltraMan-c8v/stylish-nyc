<html lang="en" data-theme="onyx-crimson">
  <head>
    <meta charset="UTF-8" />

    <meta name="color-scheme" content="dark light" />

    <meta
      name="description"
      content="What Stylish NYC collects when you use this website or send an appointment request, why we collect it, and what you can ask us to do with it."
    />

    <link rel="canonical" href="https://stylishnyc.com/privacy/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Stylish NYC" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://stylishnyc.com/privacy/" />
    <meta property="og:title" content="Privacy policy | Stylish NYC" />
    <meta property="og:description" content="What Stylish NYC does and does not collect when you use this website, and what we do with the details you give us when you book by phone." />
    <meta property="og:image" content="https://stylishnyc.com/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Privacy policy | Stylish NYC" />
    <meta name="twitter:description" content="What Stylish NYC does and does not collect when you use this website, and what we do with the details you give us when you book by phone." />
    <meta name="twitter:image" content="https://stylishnyc.com/og.jpg" />
    <!-- seo:end -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Applied before first paint so the chosen palette never flashes.
      (function () {
        var VALID = [
          'noir',
          'chalk',
          'onyx-gold',
          'onyx-crimson',
          'ivory-gold',
          'forest',
          'bordeaux',
        ]
        // Rouge unless the visitor has chosen otherwise before. Deliberately
        // not keyed off prefers-color-scheme: the palette is the salon's brand
        // decision, and opening pale on a light-mode laptop would show half of
        // all visitors a different business. The picker in the nav overrides it
        // and the choice is remembered.
        try {
          var stored = localStorage.getItem('snyc-theme')
          var theme = VALID.indexOf(stored) > -1 ? stored : 'onyx-crimson'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'onyx-crimson')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/privacy.tsx"></script>
  </body>
</html>
