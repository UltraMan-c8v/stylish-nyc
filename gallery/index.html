    <script>
      // Applied before first paint so the chosen palette never flashes.
      (function () {
        var VALID = [
          'noir',
          'paper',
          'chalk',
          'onyx-gold',
          'onyx-crimson',
          'ivory-gold',
          'forest',
          'bordeaux',
        ]
        try {
          var stored = localStorage.getItem('snyc-theme')
          var theme = VALID.indexOf(stored) > -1
            ? stored
            : window.matchMedia('(prefers-color-scheme: light)').matches ? 'paper' : 'noir'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'noir')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/gallery.tsx"></script>
  </body>
